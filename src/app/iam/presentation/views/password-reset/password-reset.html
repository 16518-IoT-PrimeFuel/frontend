<main class="iam-page">
  <form class="iam-card" (ngSubmit)="submit()">
    <h1>{{ (mode === 'confirm' ? 'auth.reset.title' : 'auth.forgot-title') | translate }}</h1>
    @if (mode === 'confirm') {
      <label>{{ 'auth.new-password' | translate }}<input name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password"></label>
    } @else {
      <label>{{ 'auth.username' | translate }}<input name="email" type="email" [(ngModel)]="email" required autocomplete="email"></label>
    }
    @if (message()) { <p role="status">{{ message() | translate }}</p> }
    @if (error()) { <p class="iam-error" role="alert">{{ error() | translate }}</p> }
    <button type="submit" [disabled]="sending()">{{ 'auth.reset.submit' | translate }}</button>
    <a routerLink="/login">{{ 'auth.login.link' | translate }}</a>
  </form>
</main>
